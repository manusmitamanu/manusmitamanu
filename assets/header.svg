<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Manusmita Mishra. CS student at RV University, Bangalore." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160B10"/>
      <stop offset="0.55" stop-color="#2A0E17"/>
      <stop offset="1" stop-color="#5C061C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B263D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B263D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <circle cx="1020" cy="150" r="300" fill="url(#glow)"/>

  <!-- name -->
  <text x="70" y="140" font-family="Lora, 'Playfair Display', Georgia, 'Times New Roman', serif" font-size="66" font-weight="500" fill="#F3E5DC">Manusmita Mishra</text>
  <text x="72" y="188" font-family="Mulish, 'Work Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#D9A0AA">cs student, rv university, bangalore</text>
  <text x="72" y="222" font-family="Lora, Georgia, serif" font-size="17" font-style="italic" fill="#F3E5DC" opacity="0.6">mostly just wondering why models say what they say</text>
  <rect x="72" y="244" width="10" height="2.5" rx="1" fill="#D9A0AA">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;0.95;1" dur="1.4s" repeatCount="indefinite"/>
  </rect>

<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
