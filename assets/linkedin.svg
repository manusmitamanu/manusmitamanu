    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D9A0AA" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#D9A0AA" stop-opacity="0"/>
