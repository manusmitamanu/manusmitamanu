<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" width="260" height="52" role="img" aria-label="find me on linkedin" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160B10"/>
      <stop offset="0.55" stop-color="#2A0E17"/>
      <stop offset="1" stop-color="#5C061C"/>
