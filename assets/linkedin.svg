  </defs>

  <rect x="1" y="1" width="258" height="50" rx="25" fill="url(#fill)" stroke="url(#edge)" stroke-width="1.2"/>
  <rect x="5" y="5" width="250" height="42" rx="21" fill="none" stroke="#F3E5DC" stroke-opacity="0.06"/>

  <!-- soft pulsing dot -->
  <circle cx="32" cy="26" r="12" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="26" r="4" fill="#D9A0AA"/>

  <text x="54" y="31" font-family="Lora, Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#F3E5DC" letter-spacing="0.3">find me on linkedin</text>

